name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Tests and architecture checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Architecture boundary check
        run: ./gradlew architectureCheck --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
          if-no-files-found: ignore

  release-apk:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every build is signed. When the upload-key secret is present the APK is
      # signed with it; otherwise the committed CI test key is used, so the
      # artifact always installs. An unsigned APK cannot be installed at all and
      # is therefore not a deliverable.
      - name: Decode upload keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "key=upload" >> "$GITHUB_OUTPUT"
            echo "Signing with the upload key from secrets."
          else
            echo "key=ci" >> "$GITHUB_OUTPUT"
            echo "No upload-key secret set - signing with the committed CI test key."
          fi

      - name: Assemble release APK
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease reportSigningKey --stacktrace

      # Proves the artifact is installable rather than assuming it. A release
      # build that silently came out unsigned would otherwise only be discovered
      # by whoever tried to install it.
      - name: Verify the APK is signed
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          case "$apk" in
            *unsigned*)
              echo "::error::Gradle produced $apk - signing did not run."
              exit 1
              ;;
          esac

          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)"
          echo "Verifying $apk"
          "$apksigner" verify --print-certs --verbose "$apk"

      - name: Name the artifact
        id: naming
        env:
          # On a pull_request event the checkout is refs/pull/N/merge, so HEAD is
          # an ephemeral merge commit that exists nowhere in the branch history.
          # Naming the artifact after it makes the build untraceable to a commit,
          # so use the pull request's real head when there is one.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          short_sha="$(echo "$HEAD_SHA" | cut -c1-7)"
          key="${{ steps.keystore.outputs.key }}"
          pr="${{ github.event.pull_request.number }}"
          if [ -n "$pr" ]; then
            echo "name=stratum-pr${pr}-${short_sha}-${key}signed" >> "$GITHUB_OUTPUT"
          else
            slug="$(echo "${{ github.ref_name }}" | tr '/' '-')"
            echo "name=stratum-${slug}-${short_sha}-${key}signed" >> "$GITHUB_OUTPUT"
          fi
          echo "Artifact will identify commit $short_sha"


      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error
