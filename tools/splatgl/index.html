<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Splat GLSL harness</title>
<style>body { margin: 0; background: #111; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Draws one frame's voxel splats (dumped by MicroScenePreview's `splats` mode)
// through the game's own splat shaders (dumped by SceneShadersTest), in WebGL 2,
// whose GLSL ES 3.00 is the language the phone compiles. Query: ?scene=<dir>&shaders=<dir>&mode=fast|exact
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'fast';

async function text(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status); return r.text(); }

function compile(gl, type, src, name) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(name + ': ' + gl.getShaderInfoLog(s));
  return s;
}
function link(gl, vs, fs, name) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs, name + '.vert'));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs, name + '.frag'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name + ' link: ' + gl.getProgramInfoLog(p));
  return p;
}

(async () => {
  const scene = JSON.parse(await text(q.get('scene') + '/scene.json'));
  const bin = await (await fetch(q.get('scene') + '/splats.bin')).arrayBuffer();
  const vs = await text(q.get('shaders') + `/splat-${mode}.vert`);
  const fs = await text(q.get('shaders') + `/splat-${mode}.frag`);

  const canvas = document.getElementById('c');
  canvas.width = scene.width; canvas.height = scene.height;
  const gl = canvas.getContext('webgl2', { antialias: false });
  if (!gl) throw new Error('no WebGL 2');
  const floatTarget = !!gl.getExtension('EXT_color_buffer_float');

  const p = link(gl, vs, fs, 'splat-' + mode);
  // The splat shader writes the colour before tone mapping, as into the game's scene target; this pass maps it as the finish does.
  const tone = link(gl, `#version 300 es
    void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`,
    `#version 300 es
    precision highp float;
    uniform sampler2D uScene; uniform float uExposure; uniform float uToneGain; uniform vec3 uTop; uniform vec3 uBottom; uniform vec2 uSize;
    out vec4 o;
    void main() {
      vec4 c = texelFetch(uScene, ivec2(gl_FragCoord.xy), 0);
      vec3 sky = mix(uBottom, uTop, gl_FragCoord.y / uSize.y);
      o = vec4(c.a > 0.5 ? 1.0 - exp(-c.rgb * uExposure * uToneGain) : sky, 1.0);
    }`, 'tone');

  const W = scene.width, H = scene.height;
  const color = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, color);
  gl.texStorage2D(gl.TEXTURE_2D, 1, floatTarget ? gl.RGBA16F : gl.RGBA8, W, H);
  const depth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, W, H);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, color, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, bin, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);

  gl.bindTexture(gl.TEXTURE_2D, null);
  // No shadow map here (uShadowTaps 0), but the sampler still needs a texture that is not the target being drawn.
  const dummy = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, dummy);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([255, 255, 255, 255]));
  gl.activeTexture(gl.TEXTURE0);

  gl.useProgram(p);
  const u = (n) => gl.getUniformLocation(p, n);
  gl.uniform1i(u('uShadowMap'), 1);
  gl.uniformMatrix4fv(u('uViewProj'), false, scene.viewProj);
  gl.uniformMatrix4fv(u('uInverseViewProj'), false, scene.inverseViewProj);
  gl.uniform1f(u('uPixelsPerUnit'), scene.pixelsPerUnit);
  gl.uniform2f(u('uViewport'), W, H);
  gl.uniform4f(u('uReveal'), 0, 0, 0, 0);
  gl.uniform3fv(u('uEye'), scene.eye);
  gl.uniform3fv(u('uSun'), scene.sun);
  gl.uniform3fv(u('uFill'), scene.fill);
  gl.uniform1f(u('uFillStrength'), scene.fillStrength);
  gl.uniform3fv(u('uSunColor'), scene.sunColor);
  gl.uniform3fv(u('uSky'), scene.sky);
  gl.uniform3fv(u('uGround'), scene.ground);
  gl.uniform3fv(u('uFog'), scene.fog);
  gl.uniform1f(u('uFogStart'), scene.fogStart);
  gl.uniform1f(u('uFogEnd'), scene.fogEnd);
  gl.uniform1f(u('uFogFloor'), scene.fogFloor);
  gl.uniform1f(u('uShadowStrength'), scene.shadowStrength);
  gl.uniform1f(u('uExposure'), scene.exposure);
  gl.uniform1i(u('uShadowTaps'), 0);
  gl.uniform1i(u('uLightCount'), scene.lights.length);
  scene.lights.forEach((l, i) => {
    gl.uniform3fv(u(`uLightPos[${i}]`), l.pos);
    gl.uniform3fv(u(`uLightColor[${i}]`), l.color);
    gl.uniform1f(u(`uLightRadius[${i}]`), l.radius);
  });
  gl.uniform1f(u('uGrain'), scene.grain);
  gl.uniform1f(u('uBevel'), 0);
  gl.uniform1f(u('uOcclusionDepth'), scene.occlusionDepth);
  gl.uniform1i(u('uHaze'), scene.haze ? 1 : 0);
  gl.uniform1f(u('uGlowGain'), scene.glowGain);
  gl.uniform3fv(u('uFocus'), scene.focus);
  gl.uniform1f(u('uFocusDistance'), scene.focusDistance);
  gl.uniform1f(u('uPixelAngle'), scene.pixelAngle);

  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);
  const t0 = performance.now();
  for (const b of scene.batches) {
    // Each batch starts at its own offset in the one buffer: 8 bytes a splat.
    gl.vertexAttribIPointer(0, 2, gl.UNSIGNED_INT, 8, b.first * 8);
    gl.uniform2f(u('uOrigin'), b.ox, b.oy);
    gl.uniform1f(u('uPerMicro'), b.perMicro);
    gl.drawArrays(gl.POINTS, 0, b.count);
  }
  gl.finish();
  const ms = performance.now() - t0;

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(tone);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, color);
  gl.uniform1i(gl.getUniformLocation(tone, 'uScene'), 0);
  gl.uniform1f(gl.getUniformLocation(tone, 'uExposure'), scene.exposure);
  gl.uniform1f(gl.getUniformLocation(tone, 'uToneGain'), scene.toneGain);
  gl.uniform3fv(gl.getUniformLocation(tone, 'uTop'), scene.skyTop);
  gl.uniform3fv(gl.getUniformLocation(tone, 'uBottom'), scene.skyBottom);
  gl.uniform2f(gl.getUniformLocation(tone, 'uSize'), W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();

  const range = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE);
  document.title = 'done';
  window.result = { splats: scene.splats, batches: scene.batches.length, ms, renderer: gl.getParameter(gl.RENDERER), floatTarget, pointSizeRange: [range[0], range[1]], error: gl.getError() };
})().catch(e => { document.title = 'error'; window.result = { error: String(e) }; });
</script>
</body>
</html>
